#
# Loaded by checkip.sh / startvpn.sh / stopvpn.sh from ~/.vpn_config.conf if
# present, otherwise from this file next to the scripts.
#
# Every key below is actually read by a script. Keys that no longer had a
# consumer were removed rather than left to mislead — notably SETUP_KILLSWITCH,
# which read as "the kill switch is off" and described it as iptables-based.
# The kill switch is UFW-based, is always applied by startvpn.sh, and is
# skipped only with the explicit --no-killswitch flag.
#
# Web app settings are separate — see webapp/.env.example.

# Monitoring intervals (seconds)
FAST_CHECK_INTERVAL=2
IP_CHECK_INTERVAL=10

# OpenVPN paths
VPN_HOME="/etc/openvpn/"
VPN_CLIENT_HOME="/etc/openvpn/client/"
VPN_LOG_FILE="/var/log/openvpn.log"

# Backup location for DNS / IPv6 state.
# Under $HOME rather than /tmp: a world-writable path would let any local user
# swap a backup file before it is restored with sudo.
BACKUP_DIR="$HOME/.vpn_backups"

# Runtime state
PID_DIR="/tmp/vpn_pids"
LOG_DIR="$SCRIPT_DIR/vpn_logs"
MAX_SESSIONS=20
