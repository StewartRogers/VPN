<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>File Organizer — VPN Monitor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --border: #0f3460;
      --text: #e0e0e0;
      --muted: #888;
      --green: #4caf50;
      --red: #f44336;
      --yellow: #ff9800;
      --blue: #2196f3;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      padding: 16px 20px;
      gap: 12px;
    }

    /* ---- header bar ---- */
    .page-header {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    .page-header h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .page-header a {
      font-size: 12px;
      color: var(--muted);
      text-decoration: none;
    }
    .page-header a:hover { color: var(--text); }

    /* ---- toolbar ---- */
    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .toolbar input[type=text] {
      flex: 1;
      min-width: 260px;
      max-width: 520px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 7px 10px;
      font-size: 13px;
    }
    .toolbar input[type=text]:focus { outline: 1px solid var(--blue); }

    .toolbar span {
      font-size: 12px;
      color: var(--muted);
      margin-left: 4px;
    }

    button {
      padding: 7px 14px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s;
      white-space: nowrap;
    }
    button:disabled { opacity: .4; cursor: default; }
    button:hover:not(:disabled) { opacity: .85; }

    .btn-primary { background: var(--blue);   color: #fff; }
    .btn-success { background: var(--green);  color: #fff; }
    .btn-save    { background: var(--border); color: var(--text); }
    .btn-stop    { background: var(--red);    color: #fff; }

    /* ---- results table (fills remaining height) ---- */
    .table-wrap {
      flex: 1;
      min-height: 0;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    thead {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--surface);
    }

    th {
      text-align: left;
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .5px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    td {
      padding: 6px 10px;
      border-bottom: 1px solid rgba(255,255,255,.04);
      vertical-align: middle;
    }

    tbody tr:hover td { background: rgba(255,255,255,.03); }

    /* column widths */
    .col-chk    { width: 32px; }
    .col-orig   { width: 35%; }
    .col-rename { width: 35%; }
    .col-flat   { width: 70px; text-align: center; }
    .col-size   { width: 80px; text-align: right; white-space: nowrap; }
    .col-result { width: 140px; }

    td.col-orig {
      font-family: monospace;
      font-size: 11px;
      color: var(--muted);
      word-break: break-all;
    }

    td.col-result { font-family: monospace; font-size: 11px; word-break: break-all; }

    input[type=text].rename-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      padding: 4px 8px;
      font-size: 12px;
      font-family: monospace;
    }
    input[type=text].rename-input:focus { outline: 1px solid var(--blue); }

    .ok   { color: var(--green); }
    .err  { color: var(--red); }
    .skip { color: var(--muted); }

    /* ---- empty / loading states ---- */
    .state-row td {
      text-align: center;
      padding: 40px;
      color: var(--muted);
      font-size: 13px;
    }

    /* ---- token modal ---- */
    #token-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    #token-modal.open { display: flex; }
    #token-modal .modal-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 24px 28px;
      min-width: 300px;
      max-width: 90vw;
    }
    #token-modal h3 { font-size: 14px; margin-bottom: 10px; }
    #token-modal p  { font-size: 11px; color: var(--muted); margin-bottom: 14px; line-height: 1.6; }
    #token-modal input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text);
      padding: 7px 10px;
      font-size: 13px;
      margin-bottom: 12px;
    }
    #token-modal input:focus { outline: 1px solid var(--blue); }
    #token-modal .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

    .muted { color: var(--muted); font-size: 11px; }
    .toolbar label { font-size: 11px; color: var(--muted); }
    .toolbar.steps { gap: 8px; }
    .modal {
      display: none; position: fixed; inset: 0; z-index: 50;
      background: rgba(0,0,0,.6); align-items: center; justify-content: center;
    }
    .modal.open { display: flex; }
    .modal .modal-box {
      background: var(--panel, #1b1f27); border: 1px solid #333;
      border-radius: 6px; padding: 16px; width: min(560px, 92vw);
    }
    .modal h3 { font-size: 14px; margin-bottom: 8px; }
    .modal .modal-actions {
      display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px;
    }
    .browse-list {
      max-height: 46vh; overflow-y: auto; margin: 10px 0;
      border: 1px solid #333; border-radius: 4px;
    }
    .browse-list .row {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 10px; font-size: 12px; cursor: pointer;
    }
    .browse-list .row:hover { background: #262b34; }
    .browse-list .row.up { color: var(--muted); }
    .bar {
      height: 6px; background: #262b34; border-radius: 3px;
      overflow: hidden; margin: 8px 0 4px;
    }
    .bar-fill { height: 100%; width: 0; background: var(--blue, #3b82f6); transition: width .2s; }
    .job-banner {
      flex-shrink: 0;
      border: 1px solid var(--yellow);
      border-radius: 6px;
      background: rgba(255,152,0,.08);
      color: var(--yellow);
      padding: 7px 10px;
      font-size: 12px;
      line-height: 1.5;
    }

    .bar-file { height: 4px; }
    .bar-file .bar-fill { background: var(--green); }

    .col-dest { width: 100px; }
    select.dest-select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      padding: 3px 6px;
      font-size: 12px;
    }
    select.dest-select:focus { outline: 1px solid var(--blue); }
    th select.dest-select { background: var(--surface); }
  </style>
</head>
<body>

<!-- Token modal -->
<div id="token-modal">
  <div class="modal-box">
    <h3>API Token Required</h3>
    <p>Enter the <code>VPN_API_TOKEN</code> for this server.</p>
    <input type="password" id="token-input" placeholder="Paste token here" autocomplete="off">
    <div class="modal-actions">
      <button class="btn-save" onclick="saveToken()">Save Token</button>
    </div>
  </div>
</div>

<!-- Header -->
<div class="page-header">
  <h1>File Organizer</h1>
  <a href="/" >← Back to Monitor</a>
</div>

<!-- Folder picker -->
<div class="toolbar">
  <label>Source</label>
  <input type="text" id="dir-input" placeholder="Source folder" readonly>
  <button class="btn-save" onclick="openBrowser('source')">Browse…</button>
</div>
<!-- Two destinations, mirroring organize.py's Movies / TV prompt. Each file is
     tagged with one of them in the table below. -->
<div class="toolbar">
  <label>Movies</label>
  <input type="text" id="out-movies" placeholder="Movies destination" readonly>
  <button class="btn-save" onclick="openBrowser('movies')">Browse…</button>
  <label>TV</label>
  <input type="text" id="out-tv" placeholder="TV destination" readonly>
  <button class="btn-save" onclick="openBrowser('tv')">Browse…</button>
</div>
<div class="toolbar">
  <span id="exclude-summary" class="muted">No subfolders excluded</span>
  <button class="btn-save" id="btn-exclude" onclick="openExcludes()" disabled>Choose exclusions…</button>
  <input type="hidden" id="exclude-input">
</div>

<!-- Steps: each one only unlocks when the previous has actually finished -->
<div class="toolbar steps">
  <button class="btn-primary" id="btn-scan"   onclick="scanFiles()">1. Scan</button>
  <button class="btn-success" id="btn-rename" onclick="applyFiles()" disabled>2. Rename</button>
  <button class="btn-success" id="btn-move"   onclick="moveFiles()"  disabled>3. Move</button>
  <button class="btn-stop"    id="btn-delete" onclick="cleanupSources()" disabled>4. Delete sources</button>
  <button class="btn-save"    id="btn-all" style="display:none" onclick="toggleSelectAll()">Select All</button>
  <span id="file-count"></span>
</div>
<div id="job-banner" class="job-banner" style="display:none"></div>
<div id="move-progress" style="display:none">
  <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
  <span id="move-label" class="muted"></span>
  <div class="bar bar-file"><div class="bar-fill" id="bar-file-fill"></div></div>
  <span id="move-file-label" class="muted"></span>
</div>

<!-- Folder browser -->
<div id="browse-modal" class="modal">
  <div class="modal-box">
    <h3 id="browse-title">Choose folder</h3>
    <div id="browse-path" class="muted"></div>
    <div id="browse-list" class="browse-list"></div>
    <div class="modal-actions">
      <button class="btn-save" onclick="closeModal('browse-modal')">Cancel</button>
      <button class="btn-primary" onclick="chooseCurrent()">Use this folder</button>
    </div>
  </div>
</div>

<!-- Exclusion picker -->
<div id="exclude-modal" class="modal">
  <div class="modal-box">
    <h3>Exclude subfolders</h3>
    <div class="muted">Ticked folders are skipped by the scan.</div>
    <div id="exclude-list" class="browse-list"></div>
    <div class="modal-actions">
      <button class="btn-save" onclick="closeModal('exclude-modal')">Cancel</button>
      <button class="btn-primary" onclick="saveExcludes()">Apply</button>
    </div>
  </div>
</div>

<!-- Results table -->
<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th class="col-chk"><input type="checkbox" id="chk-all" onclick="toggleSelectAll()"></th>
        <th class="col-orig">Original path</th>
        <th class="col-rename">Rename to</th>
        <th class="col-dest">
          <select class="dest-select" id="dest-all" onchange="setAllDest(this.value)">
            <option value="">Dest…</option>
            <option value="movies">All Movies</option>
            <option value="tv">All TV</option>
            <option value="skip">All Skip</option>
          </select>
        </th>
        <th class="col-flat">Flatten</th>
        <th class="col-size">Size</th>
        <th class="col-result">Result</th>
      </tr>
    </thead>
    <tbody id="file-tbody">
      <tr class="state-row"><td colspan="7">Enter a directory path and click Scan.</td></tr>
    </tbody>
  </table>
</div>

<script>
  // ---- token ----

  function getToken() { return localStorage.getItem('vpn_api_token') || ''; }

  function authHeaders(extra) {
    const h = Object.assign({ 'Content-Type': 'application/json' }, extra || {});
    const t = getToken();
    if (t) h['Authorization'] = 'Bearer ' + t;
    return h;
  }

  function showTokenModal() {
    document.getElementById('token-input').value = getToken();
    document.getElementById('token-modal').classList.add('open');
    document.getElementById('token-input').focus();
  }

  function saveToken() {
    const val = document.getElementById('token-input').value.trim();
    if (val) localStorage.setItem('vpn_api_token', val);
    else localStorage.removeItem('vpn_api_token');
    document.getElementById('token-modal').classList.remove('open');
  }

  document.getElementById('token-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') saveToken();
  });

  // ---- state ----

  let _sourceDir = '';
  let _files = [];

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function setState(html) {
    document.getElementById('file-tbody').innerHTML =
      `<tr class="state-row"><td colspan="7">${html}</td></tr>`;
  }

  // ---- scan ----

  async function scanFiles() {
    const dir = document.getElementById('dir-input').value.trim();
    if (!dir) return alert('Enter a directory path first.');
    const exclude = document.getElementById('exclude-input').value.trim();
    localStorage.setItem('vpn_organizer_exclude', exclude);

    setState('Scanning…');
    _files = [];
    resetSteps();
    document.getElementById('job-banner').style.display = 'none';
    document.getElementById('move-progress').style.display = 'none';
    document.getElementById('btn-all').style.display = 'none';
    document.getElementById('file-count').textContent = '';
    document.getElementById('chk-all').checked = true;

    try {
      // Destinations may live inside the source (…/media → …/media/Movies).
      // Excluding them keeps the already-filed library out of the scan.
      const destExcl = Object.values(destPaths()).filter(Boolean)
        .map(p => '&exclude_path=' + encodeURIComponent(p)).join('');
      const url = '/api/files/scan?dir=' + encodeURIComponent(dir) +
        (exclude ? '&exclude=' + encodeURIComponent(exclude) : '') + destExcl;
      const r = await fetch(url, { headers: authHeaders({}) });
      if (r.status === 401) { showTokenModal(); setState('Authentication required.'); return; }
      const data = await r.json();
      if (!r.ok) { setState(`<span style="color:var(--red)">${escHtml(data.error || 'Scan failed')}</span>`); return; }

      _sourceDir = data.source_dir;
      _files = data.files;

      if (!_files.length) { setState('No .mp4 or .mkv files found in that directory.'); return; }

      renderTable();
      resetSteps();
      document.getElementById('btn-all').style.display = '';
      document.getElementById('file-count').textContent = `${_files.length} file${_files.length !== 1 ? 's' : ''} found`;
    } catch (e) {
      setState(`<span style="color:var(--red)">Error: ${escHtml(e.message)}</span>`);
    }
  }

  // Episode markers: S01E02, 1x02, "Season 1", or a bare 3-4 digit episode
  // code. A guess only — every row stays editable before the move runs.
  const _TV_RE = /(^|[\s._-])(s\d{1,2}[\s._-]?e\d{1,3}|\d{1,2}x\d{2}|season[\s._-]?\d{1,2}|ep(isode)?[\s._-]?\d{1,3})([\s._-]|$)/i;

  function guessDest(f) {
    return _TV_RE.test(f.proposed || f.original) ? 'tv' : 'movies';
  }

  function setAllDest(value) {
    if (!value) return;
    document.querySelectorAll('.dest-select-row').forEach(s => { s.value = value; });
    document.getElementById('dest-all').value = '';
    updateSteps();
  }

  function renderTable() {
    const tbody = document.getElementById('file-tbody');
    const rows = _files.map((f, i) => {
      const mb = (f.size / 1048576).toFixed(1);
      const dest = guessDest(f);
      return `<tr data-i="${i}">
        <td class="col-chk"><input type="checkbox" class="file-chk" checked></td>
        <td class="col-orig">${escHtml(f.original)}</td>
        <td class="col-rename">
          <input type="text" class="rename-input file-rename"
                 value="${escHtml(f.proposed)}"
                 title="${escHtml(f.proposed)}"
                 placeholder="keep original name">
        </td>
        <td class="col-dest">
          <select class="dest-select dest-select-row">
            <option value="movies"${dest === 'movies' ? ' selected' : ''}>Movies</option>
            <option value="tv"${dest === 'tv' ? ' selected' : ''}>TV</option>
            <option value="skip">Skip</option>
          </select>
        </td>
        <td class="col-flat" style="text-align:center">
          <input type="checkbox" class="file-flatten" ${f.in_subdir ? 'checked' : ''}>
        </td>
        <td class="col-size" style="color:var(--muted)">${mb} MB</td>
        <td class="col-result file-result-cell"></td>
      </tr>`;
    });
    tbody.innerHTML = rows.join('');
  }

  // Allow Enter key in dir input to trigger scan
  document.getElementById('dir-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') scanFiles();
  });
  document.getElementById('exclude-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') scanFiles();
  });

  // Restore remembered exclude list and folder choices
  document.getElementById('exclude-input').value = localStorage.getItem('vpn_organizer_exclude') || '';
  for (const [target, t] of Object.entries({
        source: { input: 'dir-input',  store: 'vpn_organizer_dir' },
        movies: { input: 'out-movies', store: 'vpn_organizer_movies' },
        tv:     { input: 'out-tv',     store: 'vpn_organizer_tv' } })) {
    const saved = localStorage.getItem(t.store);
    if (saved) document.getElementById(t.input).value = saved;
    if (target === 'source' && saved) document.getElementById('btn-exclude').disabled = false;
  }

  // ---- select all toggle ----

  function toggleSelectAll() {
    const chkAll = document.getElementById('chk-all');
    const checks = document.querySelectorAll('.file-chk');
    checks.forEach(c => c.checked = chkAll.checked);
    updateSteps();
  }

  // Keep header checkbox in sync when individual rows change
  document.getElementById('file-tbody').addEventListener('change', e => {
    if (e.target.classList.contains('dest-select-row')) { updateSteps(); return; }
    if (!e.target.classList.contains('file-chk')) return;
    const all = [...document.querySelectorAll('.file-chk')];
    document.getElementById('chk-all').checked = all.every(c => c.checked);
    updateSteps();
  });

  // ---- apply ----

  async function applyFiles() {
    const rows = document.querySelectorAll('#file-tbody tr[data-i]');
    if (!rows.length) return;

    const ops = [];
    rows.forEach(row => {
      if (!row.querySelector('.file-chk').checked) return;
      const i = parseInt(row.dataset.i);
      ops.push({
        original:  _files[i].original,
        rename_to: row.querySelector('.file-rename').value.trim(),
        flatten:   row.querySelector('.file-flatten').checked,
      });
    });

    if (!ops.length) return alert('No files selected.');

    const btn = document.getElementById('btn-rename');
    btn.disabled = true;
    btn.textContent = 'Applying…';

    try {
      const r = await fetch('/api/files/organize', {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ source_dir: _sourceDir, files: ops }),
      });
      if (r.status === 401) { showTokenModal(); return; }
      const data = await r.json();
      if (!r.ok) { alert(data.error || 'Organize failed'); return; }

      const resultMap = {};
      data.results.forEach(res => { resultMap[res.original] = res; });

      rows.forEach(row => {
        const i = parseInt(row.dataset.i);
        const res = resultMap[_files[i].original];
        const cell = row.querySelector('.file-result-cell');
        if (!res) return;
        if (res.status === 'ok') {
          cell.className = 'col-result file-result-cell ok';
          cell.textContent = res.renamed_to ? '→ ' + res.renamed_to : 'Done';
        } else if (res.status === 'skipped') {
          cell.className = 'col-result file-result-cell skip';
          cell.textContent = res.message || 'Skipped';
        } else {
          cell.className = 'col-result file-result-cell err';
          cell.textContent = res.message || 'Error';
        }
      });
    } finally {
      btn.disabled = false;
      btn.textContent = '2. Rename';
    }
  }

  // ---------------------------------------------------------- folder browser
  let _browseTarget = null, _browsePath = '/';

  function closeModal(id) { document.getElementById(id).classList.remove('open'); }

  // Which input each browse target fills, and where it is remembered.
  const _TARGETS = {
    source: { input: 'dir-input',   store: 'vpn_organizer_dir',    title: 'Choose source folder' },
    movies: { input: 'out-movies',  store: 'vpn_organizer_movies', title: 'Choose Movies destination' },
    tv:     { input: 'out-tv',      store: 'vpn_organizer_tv',     title: 'Choose TV destination' },
  };

  async function openBrowser(target) {
    _browseTarget = target;
    const t = _TARGETS[target];
    document.getElementById('browse-title').textContent = t.title;
    const start = document.getElementById(t.input).value.trim();
    document.getElementById('browse-modal').classList.add('open');
    await loadBrowse(start || '/');
  }

  async function loadBrowse(path) {
    const r = await fetch('/api/files/browse?path=' + encodeURIComponent(path),
                          { headers: authHeaders({}) });
    if (r.status === 401) { showTokenModal(); return; }
    const data = await r.json();
    if (!r.ok) { alert(data.error || 'Cannot open folder'); return; }
    _browsePath = data.path;
    document.getElementById('browse-path').textContent = data.path;
    const list = document.getElementById('browse-list');
    list.innerHTML = '';
    if (data.parent) {
      const up = document.createElement('div');
      up.className = 'row up';
      up.textContent = '↑ ..';
      up.onclick = () => loadBrowse(data.parent);
      list.appendChild(up);
    }
    data.dirs.forEach(d => {
      const row = document.createElement('div');
      row.className = 'row';
      row.textContent = '📁 ' + d.name;
      row.onclick = () => loadBrowse(d.path);
      list.appendChild(row);
    });
    if (!data.dirs.length) {
      const empty = document.createElement('div');
      empty.className = 'row up';
      empty.textContent = '(no subfolders)';
      list.appendChild(empty);
    }
  }

  function chooseCurrent() {
    const t = _TARGETS[_browseTarget];
    document.getElementById(t.input).value = _browsePath;
    localStorage.setItem(t.store, _browsePath);
    closeModal('browse-modal');
    if (_browseTarget === 'source') {
      document.getElementById('btn-exclude').disabled = false;
      setExcludes([]);
    }
    resetSteps();
  }

  // ------------------------------------------------------- exclusion picker
  function setExcludes(list) {
    document.getElementById('exclude-input').value = list.join(',');
    document.getElementById('exclude-summary').textContent =
      list.length ? 'Excluded: ' + list.join(', ') : 'No subfolders excluded';
  }

  async function openExcludes() {
    const dir = document.getElementById('dir-input').value.trim();
    if (!dir) return alert('Choose a source folder first.');
    const r = await fetch('/api/files/browse?path=' + encodeURIComponent(dir),
                          { headers: authHeaders({}) });
    if (r.status === 401) { showTokenModal(); return; }
    const data = await r.json();
    if (!r.ok) { alert(data.error || 'Cannot read folder'); return; }
    const current = document.getElementById('exclude-input').value
                      .split(',').map(s => s.trim()).filter(Boolean);
    const list = document.getElementById('exclude-list');
    list.innerHTML = '';
    data.dirs.forEach(d => {
      const row = document.createElement('label');
      row.className = 'row';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.value = d.name;
      cb.checked = current.includes(d.name);
      row.appendChild(cb);
      row.appendChild(document.createTextNode(d.name));
      list.appendChild(row);
    });
    if (!data.dirs.length) list.innerHTML = '<div class="row up">(no subfolders)</div>';
    document.getElementById('exclude-modal').classList.add('open');
  }

  function saveExcludes() {
    const picked = [...document.querySelectorAll('#exclude-list input:checked')].map(c => c.value);
    setExcludes(picked);
    localStorage.setItem('vpn_organizer_exclude', picked.join(','));
    closeModal('exclude-modal');
    resetSteps();
  }

  // ------------------------------------------------------------- step gating
  // Each step unlocks only when the one before it has actually finished. The
  // delete step in particular must never be reachable while a move is still
  // copying - the source is the only complete copy until the move confirms.
  let _moveJob = null, _moveDone = false, _renamed = false;

  function resetSteps() {
    _moveJob = null; _moveDone = false; _renamed = false;
    updateSteps();
  }

  // Labels a selected row is actually asking for. A destination folder only
  // has to be set if some file is tagged with it.
  function neededDests() {
    const need = new Set();
    document.querySelectorAll('#file-tbody tr[data-i]').forEach(row => {
      if (!row.querySelector('.file-chk').checked) return;
      const d = row.querySelector('.dest-select-row').value;
      if (d !== 'skip') need.add(d);
    });
    return need;
  }

  function destPaths() {
    return { movies: document.getElementById('out-movies').value.trim(),
             tv:     document.getElementById('out-tv').value.trim() };
  }

  function updateSteps() {
    const haveFiles = !!(_files && _files.length);
    const paths = destPaths();
    const missing = [...neededDests()].filter(d => !paths[d]);
    const g = (id, reason) => {
      const el = document.getElementById(id);
      el.disabled = reason !== null;
      el.title = reason || '';
    };
    g('btn-rename', !haveFiles ? 'Scan first' : null);
    g('btn-move',   !haveFiles      ? 'Scan first'
                  : !neededDests().size ? 'Every selected file is set to Skip'
                  : missing.length  ? 'Choose a folder for: ' + missing.join(', ')
                                    : null);
    // Never reachable while a copy is in flight: until the move reports
    // complete, the source is the only complete copy of the file.
    g('btn-delete', !_moveDone ? 'Run the move step first' : null);
  }

  // ----------------------------------------------------------------- step 3
  async function moveFiles() {
    // Rows tagged Skip are left where they are — and, because the delete step
    // only ever touches folders this job reports as moved, their source
    // folders survive step 4 too.
    const rows = [...document.querySelectorAll('#file-tbody tr[data-i]')]
      .filter(r => r.querySelector('.file-chk').checked)
      .filter(r => r.querySelector('.dest-select-row').value !== 'skip');
    if (!rows.length) return alert('Select at least one file that is not set to Skip.');
    const ops = rows.map(r => {
      const i = parseInt(r.dataset.i);
      return { original: _files[i].original,
               dest: r.querySelector('.dest-select-row').value,
               rename_to: r.querySelector('.file-rename').value.trim() || _files[i].proposed };
    });

    const paths = destPaths();
    const destinations = {};
    neededDests().forEach(d => { destinations[d] = paths[d]; });

    const btn = document.getElementById('btn-move');
    btn.disabled = true;
    document.getElementById('move-progress').style.display = '';
    document.getElementById('move-label').textContent = 'Starting…';

    const r = await fetch('/api/files/move', {
      method: 'POST', headers: authHeaders(),
      body: JSON.stringify({ source_dir: _sourceDir, destinations, operations: ops }),
    });
    if (r.status === 401) { showTokenModal(); btn.disabled = false; return; }
    const data = await r.json();
    if (!r.ok) { alert(data.error || 'Move failed'); btn.disabled = false; return; }
    _moveJob = data.job_id;
    pollMove();
  }

  // A move started in another tab, or before a reload, is still running on the
  // server — the job record is the only thing that knows. Without this the copy
  // continued invisibly and step 4 could never unlock.
  async function reattachMove() {
    let jobs;
    try {
      const r = await fetch('/api/files/move', { headers: authHeaders({}) });
      if (!r.ok) return;                       // 401 handled by the first real action
      jobs = (await r.json()).jobs || [];
    } catch (e) { return; }
    if (!jobs.length) return;

    const running = jobs.find(j => j.state === 'running');
    if (running) {
      _moveJob = running.id;
      document.getElementById('move-progress').style.display = '';
      document.getElementById('move-label').textContent = 'Reattaching to move in progress…';
      banner(`Move in progress from ${running.source_dir} — reattached.`);
      pollMove();
      return;
    }
    const latest = jobs[0];
    if (latest.state === 'interrupted') {
      banner(`A move from ${latest.source_dir} was interrupted after ` +
             `${latest.moved} of ${latest.total_files} file(s). The files it ` +
             `finished are already at their destination; scan and move again ` +
             `to pick up the rest. Sources cannot be deleted from that run.`);
    }
  }

  function banner(text) {
    const el = document.getElementById('job-banner');
    el.textContent = text;
    el.style.display = '';
  }

  function fmtBytes(n) {
    if (!n) return '0 B';
    const u = ['B', 'KB', 'MB', 'GB', 'TB'];
    const i = Math.min(u.length - 1, Math.floor(Math.log(n) / Math.log(1024)));
    return (n / Math.pow(1024, i)).toFixed(i ? 1 : 0) + ' ' + u[i];
  }

  // The job id is passed down the chain rather than read from _moveJob: a
  // rescan clears _moveJob, and an in-flight poll would otherwise fetch a null
  // id and pop an error at the user.
  async function pollMove(jobId) {
    jobId = jobId || _moveJob;
    if (!jobId || jobId !== _moveJob) return;
    const r = await fetch('/api/files/move/' + jobId, { headers: authHeaders({}) });
    const job = await r.json();
    if (!r.ok) { alert(job.error || 'Lost the move job'); return; }

    const pct = job.total_bytes ? Math.round(100 * job.done_bytes / job.total_bytes) : 0;
    const stopped = job.state !== 'running';
    document.getElementById('bar-fill').style.width = pct + '%';
    document.getElementById('move-label').textContent =
      job.state === 'complete'
        ? `Move complete — ${job.results.filter(x => x.status === 'moved').length} moved, ` +
          `${fmtBytes(job.done_bytes)} transferred`
      : job.state === 'failed'
        ? `Move failed — nothing was moved (${job.results.length} file(s) errored)`
        : `${pct}% — file ${Math.min(job.done_files + 1, job.total_files)} of ${job.total_files} — ` +
          `${fmtBytes(job.done_bytes)} of ${fmtBytes(job.total_bytes)}`;

    // Second bar: the file being copied right now. On a 20GB transfer the
    // overall bar barely moves, so without this the UI looks stalled.
    const filePct = job.current_total
      ? Math.round(100 * job.current_bytes / job.current_total) : 0;
    document.getElementById('bar-file-fill').style.width =
      (stopped ? 0 : filePct) + '%';
    document.getElementById('move-file-label').textContent =
      stopped ? ''
      : job.current ? `${job.current} — ${filePct}% (${fmtBytes(job.current_bytes)} of ${fmtBytes(job.current_total)})`
      : '';

    const map = {};
    job.results.forEach(res => { map[res.original] = res; });
    document.querySelectorAll('#file-tbody tr[data-i]').forEach(row => {
      const res = map[_files[parseInt(row.dataset.i)].original];
      if (!res) return;
      const cell = row.querySelector('.file-result-cell');
      cell.className = 'col-result file-result-cell ' +
        (res.status === 'moved' ? 'ok' : res.status === 'skipped' ? 'skip' : 'err');
      cell.textContent = res.message || res.status;
    });

    if (job.state === 'interrupted') {
      banner('The move stopped before it finished — the web app restarted. ' +
             'Scan and move again; sources cannot be deleted from that run.');
      updateSteps();
      return;
    }
    if (job.state === 'failed') {
      // Every file errored, so there is nothing to delete and step 4 stays
      // locked. Without this branch the poll loop never terminated, because it
      // only ever stopped on 'complete'.
      const why = (job.results.find(x => x.status === 'error') || {}).message;
      banner('The move did not move anything' + (why ? ` — ${why}` : '') +
             '. Check the per-file results, fix the cause, and move again.');
      updateSteps();
      return;
    }
    if (job.state !== 'complete') { setTimeout(() => pollMove(jobId), 700); return; }
    // Only now is the move genuinely finished, so the delete step may unlock.
    _moveDone = true;
    updateSteps();
  }

  // ----------------------------------------------------------------- step 4
  async function cleanupSources() {
    const btn = document.getElementById('btn-delete');
    btn.disabled = true; btn.textContent = 'Deleting…';
    try {
      const r = await fetch('/api/files/cleanup', {
        method: 'POST', headers: authHeaders(),
        body: JSON.stringify({ job_id: _moveJob }),
      });
      if (r.status === 401) { showTokenModal(); return; }
      const data = await r.json();
      if (!r.ok) { alert(data.error || 'Cleanup failed'); return; }
      const del = data.results.filter(x => x.status === 'deleted');
      const kept = data.results.filter(x => x.status === 'kept');
      document.getElementById('move-label').textContent =
        `Deleted ${del.length} item(s)` + (kept.length ? `; kept ${kept.length} folder(s) with unrecognised files` : '');
    } finally {
      btn.textContent = '4. Delete sources';
    }
  }

  reattachMove();

</script>
</body>
</html>
